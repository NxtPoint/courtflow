<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>You're invited to play · NextPoint Tennis</title>
<!--
  join.html — the ONE page a non-member sees before they are a member.

  It is PUBLIC: the signed token in ?t= is the authorization, exactly like /feedback and /subscribe.
  What it shows before sign-in is deliberately thin — the club, the inviter's FIRST NAME and the time
  of the game. Never the invitee's email, never the other players' details.

  ACCEPTING requires signing in. That is the product decision, not an accident: the friend signs up,
  which is what makes them a real CRM record, makes the free week grantable (the existing 7-day trial
  refuses anyone with subscription history) and makes their seat billable to a person rather than to
  a name on a court sheet.

  Served by the never-sleeps courtflow-web so an emailed link never lands on an API cold start.
-->
<link rel="stylesheet" href="/shared/theme.css">
<style>
  :root{ --green:#0E7A47; --tint:#E8F4EE; --ink:#10231A; --muted:#5B6B62; --line:#e4ebe7; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--tint);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 56px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(16,35,26,.08);}
  .band{background:var(--green);color:#fff;padding:26px;}
  .band .brand{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;}
  .band h1{margin:.35rem 0 0;font-size:1.5rem;line-height:1.25;}
  .body{padding:24px 26px 28px;}
  .when{font-size:1.05rem;font-weight:600;margin:0 0 4px;}
  .muted{color:var(--muted);font-size:.92rem;}
  .free{background:var(--tint);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin:18px 0;}
  .free strong{display:block;margin-bottom:2px;}
  .btn{display:block;width:100%;padding:14px 18px;border-radius:12px;border:0;cursor:pointer;
    background:var(--green);color:#fff;font-size:1rem;font-weight:600;text-align:center;
    text-decoration:none;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .note{margin-top:14px;font-size:.85rem;color:var(--muted);text-align:center;}
  .err{background:#fdeceb;border:1px solid #f5c4c0;color:#8a1c13;border-radius:12px;
    padding:14px 16px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="band">
      <div class="brand">NextPoint Tennis</div>
      <h1 id="head">You're invited to play</h1>
    </div>
    <div class="body" id="body">
      <p class="muted">Loading your invitation…</p>
    </div>
  </div>
</div>

<script src="/js/auth_client.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var token = qs.get("t") || "";
  var body = document.getElementById("body");
  var head = document.getElementById("head");

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function fail(msg) {
    clear(body);
    body.appendChild(el("div", { class: "err", text: msg }));
    body.appendChild(el("a", { class: "btn", href: "/", text: "Go to NextPoint" }));
  }
  function fmt(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })
        + " at " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  if (!token) { fail("That invitation link is incomplete. Ask your friend to send it again."); return; }

  var API_BASE = (window.__API_BASE__ || "");
  fetch(API_BASE + "/api/community/invites/" + encodeURIComponent(token))
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
    .then(render)
    .catch(function () {
      fail("We couldn't find that invitation. It may have expired or already been used.");
    });

  function render(inv) {
    if (inv.status === "expired") { return fail("That invitation has expired — ask your friend for a new one."); }
    if (inv.status === "revoked") { return fail("That invitation was withdrawn."); }
    if (inv.status === "accepted") { head.textContent = "You're in"; }

    clear(body);
    var who = inv.inviter_name || "A member";
    head.textContent = who + " invited you to play";

    if (inv.game) {
      body.appendChild(el("p", { class: "when", text: fmt(inv.game.starts_at) }));
      body.appendChild(el("p", { class: "muted",
        text: (inv.game.court_name ? inv.game.court_name + " · " : "") + "NextPoint Tennis" }));
    } else {
      body.appendChild(el("p", { class: "muted", text: who + " thinks you'd enjoy a game at NextPoint." }));
    }

    // The offer, stated plainly — including the part that comes AFTER the free week. Burying "then
    // you pay" is how a goodwill gesture turns into a complaint at the desk.
    body.appendChild(el("div", { class: "free" }, [
      el("strong", { text: "Your first week is on us" }),
      el("span", { class: "muted", text: "Play free for 7 days. After that you pay a share of the court "
        + "for each game — or join, and your own court time is included." })
    ]));

    var btn = el("button", { class: "btn", text: "Sign in and take your seat" });
    btn.addEventListener("click", accept);
    body.appendChild(btn);
    body.appendChild(el("p", { class: "note",
      text: "You'll create a free NextPoint account — that's how we hold your seat." }));

    function accept() {
      btn.disabled = true;
      btn.textContent = "One moment…";
      // TFAuth handles the Clerk round-trip and comes back with a Bearer token; the accept call is
      // authenticated because the SEAT has to belong to a real person.
      window.TFAuth.requireAuth().then(function () {
        return window.TFAuth.apiJSON("/api/community/invites/accept",
          { method: "POST", body: { token: token } });
      }).then(function (res) {
        clear(body);
        head.textContent = "You're all set";
        body.appendChild(el("p", { class: "when",
          text: res.seat_taken ? "Your seat is booked." : "Welcome to NextPoint." }));
        if (res.trial && res.trial.granted) {
          body.appendChild(el("div", { class: "free" }, [
            el("strong", { text: "Your free week has started" }),
            el("span", { class: "muted", text: "Court time is included until "
              + (res.trial.current_period_end || "next week") + "." })
          ]));
        }
        body.appendChild(el("a", { class: "btn", href: "/app", text: "Open NextPoint" }));
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Sign in and take your seat";
        var msg = (e && e.body && e.body.message) || "We couldn't complete that just now.";
        body.insertBefore(el("div", { class: "err", text: msg }), body.firstChild);
      });
    }
  }
})();
</script>
</body>
</html>
